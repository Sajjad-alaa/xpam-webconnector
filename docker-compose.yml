services:
  chen-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chen-backend-dev
    volumes:
      - ./config:/opt/webconnector/config
      - ./data:/opt/webconnector/data
    ports:
      - "8082:8082"
    environment:
      LOG_LEVEL: INFO
      CORE_HOST: ${CORE_HOST:-http://host.docker.internal:8080}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-PleaseChangeMe}
      EXECUTE_PROGRAM: >-
        java -Dfile.encoding=utf-8 -XX:+ExitOnOutOfMemoryError
        -jar /opt/webconnector/webconnector.jar
        --spring.config.additional-location=optional:file:/opt/webconnector/config/
        --spring.profiles.active=dev
    restart: unless-stopped

volumes:
  chen-data:
